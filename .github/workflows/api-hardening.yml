name: API hardening
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Validate API source
        run: |
          node --check server/index.js
          node server/release-smoke.test.js
