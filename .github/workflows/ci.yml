name: Nexora CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npx --yes esbuild src/main.jsx --loader:jsx --outfile=/tmp/nexora-check.js
      - run: npm run build
      - run: node --check server/index.js
