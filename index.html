<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f6f7fb">
<title>Nexora Studio</title>
<style>html,body,#root{margin:0;min-height:100%;min-height:100vh}.boot{min-height:100vh;display:grid;place-items:center;background:#f6f7fb;font-family:Inter,system-ui,sans-serif;color:#18181b}.boot-card{padding:28px 32px;background:#fff;border:1px solid #e8e9ed;border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.06);text-align:center}.boot-mark{width:42px;height:42px;margin:0 auto 14px;border-radius:13px;background:#18181b;color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px}.boot-card b{display:block;font-size:18px}.boot-card span{display:block;margin-top:7px;color:#71717a;font-size:13px}</style>
</head>
<body>
<div id="root"><div class="boot"><div class="boot-card"><div class="boot-mark">N</div><b>Nexora Studio</b><span>Загрузка рабочей области…</span></div></div></div>
<script>
(function(){
  var root=document.getElementById('root');
  var started=Date.now();
  function showError(message){
    if(!root) return;
    root.innerHTML='<div class="boot"><div class="boot-card"><div class="boot-mark">!</div><b>Nexora Studio</b><span style="display:block;max-width:520px;line-height:1.5">'+String(message||'Не удалось загрузить интерфейс.')+'</span><button onclick="location.reload()" style="margin-top:16px;border:0;border-radius:10px;padding:10px 14px;background:#18181b;color:#fff;cursor:pointer">Обновить</button></div></div>';
  }
  window.addEventListener('error',function(e){
    if(e&&e.target&&e.target.tagName==='SCRIPT') showError('Не удалось загрузить интерфейс. Проверьте соединение и обновите страницу.');
  });
  window.setTimeout(function(){
    if(Date.now()-started>7000 && root && root.querySelector('.boot')) showError('Интерфейс не запустился за 7 секунд. Нажмите «Обновить».');
  },7500);
})();
</script>
<link rel="stylesheet" href="/src/nexora-polish.css">\n<script type="module" src="/src/main.jsx"></script>
</body>
</html>
